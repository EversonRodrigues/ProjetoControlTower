# O Genie Agent do Projeto Farol como RECURSO do bundle. O JSON ao lado é
# gerado por scripts/gerar_genie.py e versionado junto.
#
# ARMADILHA (CLAUDE.md §5): o Genie do bundle falha no deploy com
# "Table ... does not exist" se alguma fonte não existir ainda. Das 7
# fontes, 6 já estavam materializadas; a gold.mv_projetos foi criada
# ANTES deste deploy, por
#   python scripts/run_sql.py src/metricas/00-mv-projetos.sql
# e é também uma tarefa do job (metricas_governadas), para a próxima
# corrida reconstruí-la sozinha.
resources:
  genie_spaces:
    genie_farol:
      title: Farol · Diretoria
      description: |-
        Pergunte o que você precisa saber sobre os projetos, em português, e receba a resposta em segundos.

        Eu reúno os dados do Excel, do ClickUp e do MS Project numa visão só e aplico a mesma régua de prazo e custo a todos os projetos. Sem esperar relatório, sem juntar planilha.

        Experimente perguntar:

        • Quais projetos estão em risco e quanto isso vai custar?
        • Qual farol verde, na verdade, está vermelho?
        • Tenho gente parada enquanto outro projeto pede gente?
        • Por que o PRJ-011 atrasou?

        Toda resposta vem com o SQL que a gerou, para você conferir de onde saiu o número. Para simular em reais o impacto de realocar alguém, use a aba Simulador do Projeto Farol.

        Sua próxima pergunta não precisa esperar a próxima análise.
      warehouse_id: ${var.warehouse_id}
      file_path: ./farol.geniespace.json
