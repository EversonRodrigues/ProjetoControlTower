# O Genie Agent do Projeto Farol como RECURSO do bundle. O JSON ao lado é
# gerado por scripts/gerar_genie.py e versionado junto.
#
# ARMADILHA (CLAUDE.md §5): o Genie do bundle falha no deploy com
# "Table ... does not exist" se alguma fonte não existir ainda. Das 7
# fontes, 6 já estavam materializadas; a gold.mv_projetos foi criada
# ANTES deste deploy, por
#   python scripts/run_sql.py src/metricas/00-mv-projetos.sql
# e é também uma tarefa do job (metricas_governadas), para a próxima
# corrida reconstruí-la sozinha.
resources:
  genie_spaces:
    genie_farol:
      title: Farol · Diretoria
      description: >-
        As quatro perguntas do dono da Vértice respondidas em português, sobre a gold do
        Projeto Farol na fotografia de 16/10/2026: quais projetos estão atrasados e de
        quais clientes, quanto o atraso vai custar, quem está parado enquanto outro
        projeto pede gente e o que vai dar errado no próximo mês.
      warehouse_id: ${var.warehouse_id}
      file_path: ./farol.geniespace.json
